name: Poncho
description: Poncho was a consumer weather service founded in 2013 in New York City by Kuan Huang
  and Paul Murphy that delivered a personalized, personality-driven daily forecast through the messaging
  layer — Facebook Messenger, SMS, email, and Amazon Alexa — rather than a traditional weather app. Backed
  by Lightspeed Venture Partners, Comcast Ventures, and Lerer Hippeau, the company was acquired by Dirty
  Lemon and is no longer independently operating. It never published a public developer API, OpenAPI
  definition, SDKs, or developer portal, so this profile carries identity metadata only.
